[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# The support directory is populated by npm ci on each native release runner.
# Never reuse another target's node_modules (workerd/esbuild are native).
include = ["crates/alder-cli/support"]
github-build-setup = "../scripts/alder-build-setup.yml"
# Checked post-build steps verify native archives and adapt pinned installers
# to install support; CI tests guard against losing either step.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc"
]
# A GitHub repo to push Homebrew formulas to
tap = "orbistry/homebrew-tap"
formula = "alder"
# A namespace to use when publishing this package to the npm registry
npm-scope = "@alder-script"
# The npm package should have this name
npm-package = "cli"
# Path that installers should place binaries in
install-path = ["$XDG_BIN_HOME/", "~/.local/bin/"]
# Publish jobs to run in CI
publish-jobs = ["homebrew", "npm"]
# After the GitHub Release is announced, replace its notes with an
# aggregate of every co-released crate's changelog section
post-announce-jobs = ["./aggregate-release-notes"]
# Whether to install an updater program
install-updater = false
# Only trigger binary builds for alder-cli tags (ignore library crate tags)
tag-namespace = "alder-cli"

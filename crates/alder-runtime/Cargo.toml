[package]
name = "alder-runtime"
version = "0.2.2"
edition.workspace = true
description = "Embedded V8 runtime for standalone Alder programs"
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
deno_core = "=0.403.0"
deno_crypto = "=0.264.0"
deno_fetch = "=0.274.0"
deno_fs = "=0.160.0"
deno_http = { version = "=0.248.0", features = ["default_property_extractor"] }
deno_net = "=0.242.0"
deno_permissions = "=0.109.0"
deno_web = "=0.281.0"
deno_webidl = "=0.250.0"
deno_websocket = "=0.255.0"
deno_features = "=0.47.0"
sys_traits = { version = "=0.1.28", features = ["libc", "real", "winapi"] }
rustls = { version = "=0.23.40", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio = { workspace = true, features = ["time"] }

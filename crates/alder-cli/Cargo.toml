[package]
name = "alder-cli"
version = "0.6.0"
edition.workspace = true
description = "The Alder programming language"
homepage.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "alder_cli"
path = "src/lib.rs"

[[bin]]
name = "alder"
path = "src/main.rs"

[dependencies]
alder-bundle = { path = "../alder-bundle", version = "0.5.0" }
alder-codegen = { path = "../alder-codegen", version = "0.6.0" }
alder-config = { path = "../alder-config", version = "0.2.1" }
alder-driver = { path = "../alder-driver", version = "0.8.0" }
alder-fmt = { path = "../alder-fmt", version = "0.4.0" }
alder-language-server = { path = "../alder-language-server", version = "0.2.3" }
alder-runtime = { path = "../alder-runtime", version = "0.4.0" }
anstream = "1"
anstyle = "1"
clap.workspace = true
color-print.workspace = true
dirs.workspace = true
futures.workspace = true
glob.workspace = true
miette.workspace = true
octocrab.workspace = true
serde.workspace = true
serde_json = "1"
sha2.workspace = true
flate2 = "1"
brotli = "8"
supports-hyperlinks = "3.2"
tar.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["io-std", "macros", "rt-multi-thread", "signal"] }
tower-lsp-server.workspace = true
url.workspace = true
xz2.workspace = true
zip.workspace = true

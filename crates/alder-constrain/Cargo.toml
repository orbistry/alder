[package]
name = "alder-constrain"
version = "0.3.1"
edition.workspace = true
description = """
Responsible for building the set of constraints that are used \
during type inference of a program, and for gathering context \
needed for pleasant error messages when a type error occurs.
"""
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
bumpalo.workspace = true
alder-ast = { path = "../alder-ast", version = "0.3.0" }
alder-region = { path = "../alder-region", version = "0.2.0" }

[dev-dependencies]
alder-can = { path = "../alder-can" }
alder-parse = { path = "../alder-parse" }
indoc.workspace = true

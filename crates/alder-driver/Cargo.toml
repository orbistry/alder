[package]
name = "alder-driver"
version = "0.7.0"
edition.workspace = true
description = "Build system and driver for Alder projects"
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
bincode.workspace = true
bumpalo.workspace = true
glob.workspace = true
miette.workspace = true
serde.workspace = true
serde_json = "1.0"
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "fs"] }
url.workspace = true

alder-config = { path = "../alder-config", version = "0.2.1" }
alder-ast = { path = "../alder-ast", version = "0.3.1" }
alder-can = { path = "../alder-can", version = "0.6.1" }
alder-codegen = { path = "../alder-codegen", version = "0.5.1" }
alder-constrain = { path = "../alder-constrain", version = "0.5.2" }
alder-parse = { path = "../alder-parse", version = "0.5.0" }
alder-region = { path = "../alder-region", version = "0.2.0" }
alder-report = { path = "../alder-report", version = "0.3.0" }
alder-solve = { path = "../alder-solve", version = "0.5.2" }
alder-source = { path = "../alder-source", version = "0.4.0" }

[dev-dependencies]
alder-fmt = { path = "../alder-fmt" }
alder-bundle = { path = "../alder-bundle" }
alder-kernel = { path = "../alder-kernel" }
alder-runtime = { path = "../alder-runtime" }
indoc.workspace = true
insta.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

- name: Install Node.js for compiler support
  uses: actions/setup-node@v6
  with:
    node-version: "22"
    cache: npm
    cache-dependency-path: crates/alder-cli/support/package-lock.json
- name: Verify native compiler support target
  shell: bash
  run: node .github/scripts/prepare-alder-support.mjs --check-host "${{ join(matrix.targets, ' ') }}"
- name: Install locked compiler support dependencies
  shell: bash
  run: npm ci --prefix crates/alder-cli/support --omit=dev --bin-links=false --no-audit --no-fund
- name: Validate release support tree and native workerd
  shell: bash
  run: node .github/scripts/prepare-alder-support.mjs --verify "${{ join(matrix.targets, ' ') }}"

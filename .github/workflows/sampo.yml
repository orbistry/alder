name: Sampo

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# Publishing is irreversible: a second push must wait for the current release
# to finish, then check the registry again instead of racing its publish plan.
concurrency:
  group: sampo-release
  cancel-in-progress: false

jobs:
  sampo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Configure git identity
        run: |
          git config user.name "rvcas"
          git config user.email "x@rvcas.dev"
      - name: Sampo
        id: sampo
        uses: bruits/sampo/crates/sampo-github-action@main
        with:
          cargo-token: ${{ secrets.CARGO_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

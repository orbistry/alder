# Invoked by the dist-generated release workflow (post-announce-jobs in
# dist-workspace.toml) after the GitHub Release exists. Replaces the
# changelog portion of the release body with notes aggregated across every
# crate co-released at this tag, preserving generated installers. If this job
# fails, the release simply keeps alder-cli's notes.
name: aggregate-release-notes

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  aggregate:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # All history and tags: co-released crates are found via the
          # release tags pointing at this commit.
          fetch-depth: 0
      - name: Aggregate per-crate changelogs
        env:
          DIST_PLAN: ${{ inputs.plan }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s' "$DIST_PLAN" > "$RUNNER_TEMP/plan.json"
          gh release view "$RELEASE_TAG" --json body > "$RUNNER_TEMP/current-notes.json"
          python3 .github/scripts/aggregate_release_notes.py --body "$RUNNER_TEMP/current-notes.json" --plan "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Update release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"

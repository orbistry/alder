name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install components
        run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Target cleanup drops V8's gn_out archive but retains Cargo metadata.
          # Use a new prefix so older incomplete target caches cannot restore.
          prefix-key: v1-rust-registry-only
          cache-targets: "false"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test
      - name: Verify release packages
        # Use a fresh target directory: unreleased local versions can otherwise
        # reuse stale dependency artifacts from an earlier package verification.
        run: cargo package --workspace --target-dir "$RUNNER_TEMP/alder-package"

  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep this aligned with the Linux job's registry-only cache policy.
          prefix-key: v1-rust-registry-only
          cache-targets: "false"
      - name: Build CLI
        run: cargo build --locked -p alder-cli

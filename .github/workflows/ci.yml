name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  release-notes:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test release-note aggregation and preservation
        run: python -m unittest discover -s .github/scripts -p '*_test.py'

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install components
        run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Target cleanup drops V8's gn_out archive but retains Cargo metadata.
          # Use a new prefix so older incomplete target caches cannot restore.
          prefix-key: v1-rust-registry-only
          cache-targets: "false"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Explicit Cloudflare tooling setup
        run: cargo run --locked -p alder-cli -- cloudflare setup
      - name: Test offline setup isolation and cache publication
        run: cargo test --locked -p alder-cli real_npm_setup_is_local -- --ignored --nocapture
      - name: Remove CI Cloudflare tooling
        if: always()
        run: cargo run --locked -p alder-cli -- cloudflare setup --remove
      - name: Verify release packages
        # Use a fresh target directory: unreleased local versions can otherwise
        # reuse stale dependency artifacts from an earlier package verification.
        run: cargo package --workspace --target-dir "$RUNNER_TEMP/alder-package"

  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep this aligned with the Linux job's registry-only cache policy.
          prefix-key: v1-rust-registry-only
          cache-targets: "false"
      - name: Build CLI
        run: cargo build --locked -p alder-cli
      - name: Test CLI cache and installer behavior
        run: cargo test --locked -p alder-cli
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Explicit Cloudflare tooling setup
        run: cargo run --locked -p alder-cli -- cloudflare setup
      - name: Test offline setup isolation and cache publication
        run: cargo test --locked -p alder-cli real_npm_setup_is_local -- --ignored --nocapture
      - name: Remove CI Cloudflare tooling
        if: always()
        run: cargo run --locked -p alder-cli -- cloudflare setup --remove
